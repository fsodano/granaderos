name: Campaign tests

on:
  workflow_call:
    inputs:
      duration:
        description: Duration profile within the campaign scope
        type: string
        default: quick
  workflow_dispatch:
    inputs:
      duration:
        description: Duration profile within the campaign scope
        type: choice
        options: [quick, full, extended]
        default: quick

permissions:
  contents: read

jobs:
  campaign:
    name: Campaign (${{ inputs.duration }})
    runs-on: ubuntu-latest
    # Complete native routes are an explicit manual choice, and need more time.
    timeout-minutes: ${{ inputs.duration == 'quick' && 60 || 180 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix web
      - name: Run the selected campaign duration profile
        env:
          DURATION: ${{ inputs.duration }}
        run: npm run test:campaign -- --duration "$DURATION" --concurrency 2
      - name: Preserve test totals and scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-test-report-${{ inputs.duration }}
          path: .cache/test-times/campaign*.json
          if-no-files-found: ignore
          retention-days: 7
