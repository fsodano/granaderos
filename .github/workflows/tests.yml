name: Minimal tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimal-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/campaign-editor/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix apps/web
      - name: Install editor dependencies
        run: npm ci --prefix apps/campaign-editor
      - name: Lint architecture and browser boundaries
        run: npm run lint
      - name: Check architecture boundaries
        run: npm run check:architecture
      - name: Check source formatting
        run: npm run check:format
      - name: Check types
        run: npm run typecheck
      - name: Run minimal tests
        run: npm test
