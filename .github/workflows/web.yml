name: Web game build and tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.group }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix web
      - name: Test partition coverage and failure propagation
        run: node --test tools/test-shard-selftest.mjs
      - name: Verify complete test partition
        run: node tools/test-shard.mjs --check
      - name: Test tactical and strategic simulation
        run: node tools/test-shard.mjs --run ${{ matrix.group }}
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser dependencies
        run: npm ci --prefix web
      - name: Check design and progress records
        run: npm run audit:docs
      - name: Check reference gameplay values
        run: npm run audit:baseline
      - name: Check browser types
        run: npm run typecheck
      - name: Build and verify static game export
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Granaderos-web
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
