name: Web game build and Pages
# Main pushes build and publish Pages; manual builds remain available.
# Main and pull requests use the same local verification command.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: web-game-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRANADEROS_BASE_PATH: /granaderos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/campaign-editor/package-lock.json
            tools/playgrounds/granadero-3d/package-lock.json
      - name: Install browser dependencies
        run: npm ci --prefix apps/web
      - name: Install editor dependencies
        run: npm ci --prefix apps/campaign-editor
      - name: Install playground test dependencies
        run: npm ci --prefix tools/playgrounds/granadero-3d
      - name: Verify and build the browser export
        run: npm run verify
      - name: Record verified build revision
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const build=JSON.parse(readFileSync('.output/dist/build-info.json','utf8'));
          assert.equal(build.revision,process.env.GITHUB_SHA,'The export must match the selected revision.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Verified static export: ${build.version} · ${build.id}\n\nRevision: ${build.revision}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: Granaderos-web
          path: .output/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/dist/
  deploy:
    name: Publish browser game
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish verified static game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record published revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Published %s\n\nRevision: %s\n' "$PAGE_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
