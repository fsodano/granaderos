name: Web game build and Pages
# Browser builds and publication remain manual. Simulation tests have their
# own core/campaign workflows and do not run as part of a deployment.
on:
  workflow_dispatch:
concurrency:
  group: web-game-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRANADEROS_BASE_PATH: /granaderos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser dependencies
        run: npm ci --prefix web
      - name: Check design and progress records
        run: npm run audit:docs
      - name: Check reference gameplay values
        run: npm run audit:baseline
      - name: Check browser types
        run: npm run typecheck
      - name: Check deployment paths and browser workers
        run: node --test tests/site-path.test.mjs tests/project-path-render.test.mjs tests/static-export-path.test.mjs tests/stage-static-deployment.test.mjs tests/browser-worker-export.test.mjs
      - name: Build and verify static game export
        run: npm run build
      - name: Record verified build revision
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,appendFileSync} from 'node:fs';
          const build=JSON.parse(readFileSync('dist/build-info.json','utf8'));
          assert.equal(build.revision,process.env.GITHUB_SHA,'The export must match the selected revision.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Verified static export: ${build.version} · ${build.id}\n\nRevision: ${build.revision}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: Granaderos-web
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
  deploy:
    name: Publish browser game
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish verified static game
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record published revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf 'Published %s\n\nRevision: %s\n' "$PAGE_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
