name: Core mechanic tests

on:
  workflow_call:
    inputs:
      duration:
        description: Duration profile within the core scope
        type: string
        default: quick
  workflow_dispatch:
    inputs:
      duration:
        description: Duration profile within the core scope
        type: choice
        options: [quick, full, extended]
        default: quick

permissions:
  contents: read

jobs:
  core:
    name: Core mechanics (${{ inputs.duration }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix web
      - name: Run the selected core duration profile
        env:
          DURATION: ${{ inputs.duration }}
        run: npm run test:core -- --duration "$DURATION" --concurrency 2
      - name: Preserve test totals and scope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report-${{ inputs.duration }}
          path: .cache/test-times/core*.json
          if-no-files-found: ignore
          retention-days: 7
